name: Windows app
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Test UI
        run: |
          set -o pipefail
          npm run test:ui 2>&1 | tee ui-test.log
      - name: Build Windows offline ZIP
        run: |
          set -o pipefail
          npx electron-builder --win zip --publish never --config.win.signAndEditExecutable=false --config.artifactName=siji-todo-windows-x64.zip 2>&1 | tee build.log
      - name: Include build diagnostics
        if: failure()
        run: |
          for file in ui-test.log build.log; do
            if [ -f "$file" ]; then
              echo "### $file" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              tail -100 "$file" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: siji-todo-windows
          path: dist/*.zip
          if-no-files-found: error
      - name: Publish version download
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 四季待办 ${{ github.ref_name }}
          body: Windows 10 / 11 x64 离线版本。下载 ZIP 后完整解压，运行「四季待办.exe」。支持标签行子任务按钮、按日期查看操作记录和导出 Markdown。旧版事项保留，历史从升级后的操作开始记录。升级前请先导出 JSON 备份并退出旧应用。提醒需要应用保持运行。
          files: dist/siji-todo-windows-x64.zip
          fail_on_unmatched_files: true
