name: Windows app
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Create downloadable Windows ZIP
        run: Compress-Archive -Path dist/win-unpacked/* -DestinationPath dist/siji-todo-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: siji-todo-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
      - name: Publish version download
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 四季待办 ${{ github.ref_name }}
          body: Windows 10 / 11 x64 离线版本。下载 ZIP 后完整解压，运行「四季待办.exe」。提醒需要应用保持运行。
          files: dist/siji-todo-windows-x64.zip
          fail_on_unmatched_files: true
