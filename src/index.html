<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'"><title>四季待办</title><link rel="stylesheet" href="style.css"></head>
<body><aside><div class="brand">◈ 四季待办<small>留一点从容，给每一天</small></div><nav><button data-view="plan" class="active">☀　今日计划</button><button data-view="all">☰　全部待办 <span id="total"></span></button><button data-view="done">✓　已完成</button><button data-view="issues">◈　问题跟踪</button><button data-view="journal">▤　每日记录</button></nav><div class="section-label">我的清单 <button id="add-group" aria-label="新增分组">＋</button></div><div id="groups"></div><footer><div class="offline">● 本机存储 · 离线可用</div><button id="export">导出备份</button><button id="import">导入备份</button><p>关闭窗口后留在托盘提醒</p></footer></aside>
<main><header><div><div class="eyebrow" id="date"></div><h1 id="heading">今日计划</h1><p id="summary"></p></div><div class="header-tools"><input id="search" type="search" placeholder="搜索事项…" aria-label="搜索任务"><button id="toggle-planning" aria-expanded="true" aria-controls="planning-panel">收起参考</button></div></header><div id="workspace"><div id="work-primary"><section class="composer"><form id="add-task"><div class="quick-add"><input id="title" placeholder="接下来，想完成什么？" required maxlength="200" aria-label="任务标题"><button class="primary" type="submit">＋ 添加</button></div><details id="task-options"><summary>分类、清单与提醒</summary><div class="composer-options"><select id="category" aria-label="事项分类"><option value="task">普通待办</option><option value="issue">问题跟踪</option></select><select id="group" aria-label="所属清单"></select><select id="quadrant" aria-label="四象限"><option value="1">重要且紧急</option><option value="2" selected>重要不紧急</option><option value="3">紧急不重要</option><option value="4">不重要不紧急</option></select><input id="reminder" type="datetime-local" aria-label="提醒时间"></div><div id="issue-fields" class="issue-fields" hidden><label>提出人<input id="reporter" maxlength="80" placeholder="谁提出了问题"></label><label>跟踪人<input id="tracker" maxlength="80" placeholder="谁负责跟进"></label><label>阶段<select id="stage"><option>分析中</option><option>等待回复</option><option>训练中</option><option>回归中</option></select></label></div></details></form></section><div id="status" role="status"></div><section id="journal-controls" hidden><div class="journal-toolbar"><label>记录日期 <input id="journal-day" type="date"></label><button id="journal-today">今天</button><button id="export-day" class="primary">导出当天 Markdown</button><button id="export-history">导出全部日期</button></div><p>按每天的实际操作归档，保留完整事项和子任务。旧版事项从升级后的操作开始记录。</p></section><section id="issue-controls" hidden><label>阶段筛选 <select id="issue-filter"><option value="">全部阶段</option><option>分析中</option><option>等待回复</option><option>训练中</option><option>回归中</option></select></label></section><div id="tasks"></div></div><div id="planning-panel" role="complementary" aria-label="今日计划参考" hidden><section class="support-panel" aria-labelledby="reminder-heading"><div class="panel-heading"><h2 id="reminder-heading">今日提醒 <span id="reminder-count" class="panel-count"></span></h2><span class="panel-caption">按时间</span></div><div id="reminder-list" class="support-list"></div></section><section class="support-panel" aria-labelledby="matrix-heading"><div class="panel-heading"><h2 id="matrix-heading">四象限 <span id="matrix-count" class="panel-count"></span></h2><span class="panel-caption">全部未完成</span></div><div id="reference-matrix"></div></section></div></div><div class="bottom-note">一步一步，把想做的事变成已完成。</div></main>
<dialog id="edit-dialog"><form id="edit-form"><h2>编辑任务</h2><label>任务名称<input id="edit-title" required maxlength="200"></label><label>分类<select id="edit-category"><option value="task">普通待办</option><option value="issue">问题跟踪</option></select></label><div id="edit-issue-fields" hidden><label>提出人<input id="edit-reporter" maxlength="80"></label><label>跟踪人<input id="edit-tracker" maxlength="80"></label><label>阶段<select id="edit-stage"><option>分析中</option><option>等待回复</option><option>训练中</option><option>回归中</option></select></label></div><label>清单<select id="edit-group"></select></label><label>四象限<select id="edit-quadrant"><option value="1">重要且紧急</option><option value="2">重要不紧急</option><option value="3">紧急不重要</option><option value="4">不重要不紧急</option></select></label><label>提醒时间<input id="edit-reminder" type="datetime-local"></label><p>清空时间可取消提醒。修改时间后会重新提醒。</p><div class="dialog-actions"><button type="button" id="cancel-edit">取消</button><button class="primary">保存</button></div></form></dialog>
<dialog id="group-dialog"><form id="group-form"><h2>新增清单</h2><label>清单名称<input id="group-name" placeholder="工作、生活、学习…" maxlength="80" required></label><div class="dialog-actions"><button type="button" id="cancel-group">取消</button><button class="primary">创建</button></div></form></dialog>
<script src="planner.js"></script><script src="renderer.js"></script></body></html>
