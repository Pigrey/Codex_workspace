<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'"><title>四季待办</title><link rel="stylesheet" href="style.css"></head>
<body><aside><div class="brand">◈ 四季待办<small>留一点从容，给每一天</small></div><nav><button data-view="all" class="active">☰　全部待办 <span id="total"></span></button><button data-view="today">◷　今日提醒</button><button data-view="matrix">▦　四象限</button><button data-view="done">✓　已完成</button><button data-view="journal">▤　每日记录</button></nav><div class="section-label">我的清单 <button id="add-group" aria-label="新增分组">＋</button></div><div id="groups"></div><footer><div class="offline">● 本机存储 · 离线可用</div><button id="export">导出备份</button><button id="import">导入备份</button><p>关闭窗口后留在托盘提醒</p></footer></aside>
<main><header><div><div class="eyebrow" id="date"></div><h1 id="heading">全部待办</h1><p id="summary"></p></div><input id="search" type="search" placeholder="搜索任务或子任务…" aria-label="搜索任务"></header><section class="composer"><form id="add-task"><input id="title" placeholder="接下来，想完成什么？" required maxlength="200" aria-label="任务标题"><div class="composer-options"><select id="group" aria-label="所属清单"></select><select id="quadrant" aria-label="四象限"><option value="1">重要且紧急</option><option value="2" selected>重要不紧急</option><option value="3">紧急不重要</option><option value="4">不重要不紧急</option></select><input id="reminder" type="datetime-local" aria-label="提醒时间"><button class="primary" type="submit">＋ 添加任务</button></div></form></section><div id="status" role="status"></div><section id="journal-controls" hidden><div class="journal-toolbar"><label>记录日期 <input id="journal-day" type="date"></label><button id="journal-today">今天</button><button id="export-day" class="primary">导出当天 Markdown</button><button id="export-history">导出全部日期</button></div><p>按每天的实际操作归档，保留完整事项和子任务。旧版事项从升级后的操作开始记录。</p></section><div id="tasks"></div><div class="bottom-note">一步一步，把想做的事变成已完成。</div></main>
<dialog id="edit-dialog"><form id="edit-form"><h2>编辑任务</h2><label>任务名称<input id="edit-title" required maxlength="200"></label><label>清单<select id="edit-group"></select></label><label>四象限<select id="edit-quadrant"><option value="1">重要且紧急</option><option value="2">重要不紧急</option><option value="3">紧急不重要</option><option value="4">不重要不紧急</option></select></label><label>提醒时间<input id="edit-reminder" type="datetime-local"></label><p>清空时间可取消提醒。修改时间后会重新提醒。</p><div class="dialog-actions"><button type="button" id="cancel-edit">取消</button><button class="primary">保存</button></div></form></dialog>
<dialog id="group-dialog"><form id="group-form"><h2>新增清单</h2><label>清单名称<input id="group-name" placeholder="工作、生活、学习…" maxlength="80" required></label><div class="dialog-actions"><button type="button" id="cancel-group">取消</button><button class="primary">创建</button></div></form></dialog>
<script src="renderer.js"></script></body></html>
